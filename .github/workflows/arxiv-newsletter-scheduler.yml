name: ArXiv Newsletter Scheduler

on:
  schedule:
    # Checks hourly on weekdays. The first check is the same intended hour as the
    # old newsletter schedule: 13:00 UTC = 08:00 EST / 09:00 EDT.
    - cron: "0 13-23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: arxiv-newsletter-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Decide whether to dispatch newsletter
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          REPOSITORY = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          WORKER_WORKFLOW = "arxiv-newsletter.yml"
          REF = "master"
          CYCLE_START_HOUR_UTC = 13
          MAX_ATTEMPTS = 6  # Initial attempt plus five retries.
          MIN_SECONDS_BETWEEN_ATTEMPT_STARTS = 60 * 60

          def api(method: str, path: str, payload: dict | None = None) -> dict | None:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      body = response.read()
              except urllib.error.HTTPError as exc:
                  sys.stderr.write(exc.read().decode("utf-8", errors="replace"))
                  raise
              if not body:
                  return None
              return json.loads(body)

          def parse_time(value: str | None) -> datetime:
              if not value:
                  return datetime.min.replace(tzinfo=timezone.utc)
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          now = datetime.now(timezone.utc)
          if now.hour < CYCLE_START_HOUR_UTC:
              print(
                  f"Scheduler is before {CYCLE_START_HOUR_UTC}:00 UTC; "
                  "not dispatching."
              )
              raise SystemExit(0)

          cycle = now.date().isoformat()
          title_prefix = f"ArXiv Newsletter scheduled {cycle} attempt "
          print(f"Checking newsletter attempts for scheduler cycle {cycle}")

          runs_payload = api(
              "GET",
              f"/repos/{REPOSITORY}/actions/workflows/{WORKER_WORKFLOW}/runs"
              "?event=workflow_dispatch&per_page=100",
          )
          runs = runs_payload.get("workflow_runs", []) if runs_payload else []

          attempts = []
          for run in runs:
              title = run.get("display_title") or ""
              if not title.startswith(title_prefix):
                  continue
              match = re.search(r" attempt (\d+)$", title)
              if not match:
                  continue
              attempts.append(
                  {
                      "attempt": int(match.group(1)),
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "started_at": parse_time(run.get("run_started_at") or run.get("created_at")),
                      "updated_at": parse_time(run.get("updated_at")),
                      "url": run.get("html_url"),
                  }
              )

          if not attempts:
              next_attempt = 1
              print("No attempts found for this cycle; dispatching attempt 1.")
          else:
              attempts.sort(key=lambda item: (item["attempt"], item["started_at"]))
              if any(item["conclusion"] == "success" for item in attempts):
                  print("A previous attempt for this cycle succeeded; not dispatching.")
                  raise SystemExit(0)

              active_attempts = [
                  item for item in attempts if item["status"] in {"queued", "in_progress", "waiting"}
              ]
              if active_attempts:
                  latest_active = max(active_attempts, key=lambda item: item["started_at"])
                  print(
                      "An attempt is still active; not dispatching. "
                      f"Attempt {latest_active['attempt']}: {latest_active['url']}"
                  )
                  raise SystemExit(0)

              latest_attempt = max(attempts, key=lambda item: (item["attempt"], item["started_at"]))
              if latest_attempt["attempt"] >= MAX_ATTEMPTS:
                  print(
                      f"Reached max attempts ({MAX_ATTEMPTS}) for cycle {cycle}; "
                      "not dispatching."
                  )
                  raise SystemExit(0)

              seconds_since_latest_start = (now - latest_attempt["started_at"]).total_seconds()
              if seconds_since_latest_start < MIN_SECONDS_BETWEEN_ATTEMPT_STARTS:
                  remaining = int(MIN_SECONDS_BETWEEN_ATTEMPT_STARTS - seconds_since_latest_start)
                  print(
                      "Latest attempt started less than 1 hour ago; "
                      f"not dispatching. Seconds remaining: {remaining}"
                  )
                  raise SystemExit(0)

              next_attempt = latest_attempt["attempt"] + 1
              print(
                  f"Latest attempt {latest_attempt['attempt']} concluded as "
                  f"{latest_attempt['conclusion']}; dispatching attempt {next_attempt}."
              )

          api(
              "POST",
              f"/repos/{REPOSITORY}/actions/workflows/{WORKER_WORKFLOW}/dispatches",
              {
                  "ref": REF,
                  "inputs": {
                      "scheduler_cycle": cycle,
                      "scheduler_attempt": str(next_attempt),
                  },
              },
          )
          print(f"Dispatched newsletter attempt {next_attempt} for cycle {cycle}.")
          PY
