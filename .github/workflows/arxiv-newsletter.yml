name: ArXiv Newsletter

on:
  schedule:
    # Runs Monday-Friday at 08:00 Toronto time (EST) or 09:00 (EDT).
    # GitHub schedules use UTC; 13:00 UTC = 08:00 EST / 09:00 EDT.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

concurrency:
  group: paper-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          ref: master
          path: app
      - name: Checkout paper state
        uses: actions/checkout@v4
        with:
          ref: paper-state
          path: paper-state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv
      - name: Install dependencies
        working-directory: app
        run: uv sync --frozen
      - name: Create .env
        working-directory: app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRIORITY_AUTHORS: ${{ secrets.PRIORITY_AUTHORS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          keys = [
              "OPENAI_API_KEY",
              "GMAIL_ADDRESS",
              "GMAIL_APP_PASSWORD",
              "OPENROUTER_API_KEY",
              "GEMINI_API_KEY",
              "PRIORITY_AUTHORS",
          ]
          lines = [f"{key}={os.environ[key]}" for key in keys if os.environ.get(key)]
          Path(".env").write_text("\n".join(lines) + "\n")
          PY
      - name: Run newsletter
        working-directory: app
        env:
          PAPER_STATE_PATH: ../paper-state/state/discovered_papers.json
        run: uv run -m ir_arxiv_ranker --config my_config/config.yaml
      - name: Commit updated paper state
        if: always()
        working-directory: paper-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/discovered_papers.json
          git diff --cached --quiet || git commit -m "Update discovered paper state"
          git push
