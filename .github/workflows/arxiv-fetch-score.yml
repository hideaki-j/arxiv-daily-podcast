name: ArXiv Fetch and Score

on:
  schedule:
    # Community discussion suggests arXiv API traffic is lighter from
    # 06:00-16:00 UTC, away from the busiest post-announcement period.
    - cron: "0 6-16 * * 1-5"
  workflow_dispatch:

concurrency:
  group: paper-state
  cancel-in-progress: false

jobs:
  fetch-score:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check fetch-score attempt window
        id: fetch_score_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from __future__ import annotations

          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, time, timezone

          if os.environ["EVENT_NAME"] != "schedule":
              print("should_run=true")
              raise SystemExit(0)

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run_id = int(os.environ["GITHUB_RUN_ID"])
          workflow = "arxiv-fetch-score.yml"
          max_attempts = 6

          def parse_time(value: str | None) -> datetime:
              if not value:
                  return datetime.min.replace(tzinfo=timezone.utc)
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              f"{workflow}/runs?event=schedule&per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request) as response:
                  payload = json.loads(response.read() or "{}")
          except urllib.error.HTTPError as exc:
              sys.stderr.write(exc.read().decode("utf-8", errors="replace"))
              raise

          now = datetime.now(timezone.utc)
          cycle_start = datetime.combine(now.date(), time(6, 0), tzinfo=timezone.utc)
          previous_attempts = []
          for run in payload.get("workflow_runs", []):
              if int(run.get("id", 0)) == current_run_id:
                  continue
              started_at = parse_time(run.get("run_started_at") or run.get("created_at"))
              if started_at < cycle_start:
                  continue
              previous_attempts.append(
                  {
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "started_at": started_at,
                      "url": run.get("html_url"),
                  }
              )

          if any(run["conclusion"] == "success" for run in previous_attempts):
              print("should_run=false")
              print("reason=previous_success")
              raise SystemExit(0)

          active = [
              run
              for run in previous_attempts
              if run["status"] in {"queued", "in_progress", "waiting"}
          ]
          if active:
              print("should_run=false")
              print("reason=previous_attempt_active")
              raise SystemExit(0)

          if len(previous_attempts) >= max_attempts:
              print("should_run=false")
              print("reason=max_attempts_reached")
              raise SystemExit(0)

          print("should_run=true")
          print(f"attempt={len(previous_attempts) + 1}")
          PY
      - name: Checkout app
        if: steps.fetch_score_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: master
          path: app
      - name: Checkout paper state
        if: steps.fetch_score_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: paper-state
          path: paper-state
      - uses: actions/setup-python@v5
        if: steps.fetch_score_gate.outputs.should_run == 'true'
        with:
          python-version: "3.11"
      - name: Install uv
        if: steps.fetch_score_gate.outputs.should_run == 'true'
        run: python -m pip install --upgrade pip && pip install uv
      - name: Install dependencies
        if: steps.fetch_score_gate.outputs.should_run == 'true'
        working-directory: app
        run: uv sync --frozen
      - name: Create .env
        if: steps.fetch_score_gate.outputs.should_run == 'true'
        working-directory: app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRIORITY_AUTHORS: ${{ secrets.PRIORITY_AUTHORS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          keys = [
              "OPENAI_API_KEY",
              "OPENROUTER_API_KEY",
              "GEMINI_API_KEY",
              "PRIORITY_AUTHORS",
          ]
          lines = [f"{key}={os.environ[key]}" for key in keys if os.environ.get(key)]
          Path(".env").write_text("\n".join(lines) + "\n")
          PY
      - name: Fetch, score, and store papers
        if: steps.fetch_score_gate.outputs.should_run == 'true'
        working-directory: app
        env:
          PAPER_STATE_PATH: ../paper-state/state/discovered_papers.json
        run: uv run -m ir_arxiv_ranker --config my_config/config.yaml --stage fetch-score
      - name: Commit updated paper state
        if: always() && steps.fetch_score_gate.outputs.should_run == 'true'
        working-directory: paper-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/discovered_papers.json
          git diff --cached --quiet || git commit -m "Update discovered paper state"
          git push
