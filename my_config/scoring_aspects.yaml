      Score 2 when agentic search is a central research focus, including work
      on deep research agents as a form of agentic search. Score 1 when agentic
      search is explicitly investigated but is secondary. Score 0 when agentic
      search is absent. Always score 0 for work limited to traditional sparse
      or dense retrieval, bi-encoder retrieval, cross-encoder reranking, or
      retrieval-augmented generation unless it explicitly investigates the
      capabilities of agentic search or deep research agents.
