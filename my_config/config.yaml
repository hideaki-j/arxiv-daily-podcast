# Feature flags
email_enabled: true
generate_transcript: true
generate_manga_image: false
filter_since_last_schedule: true
use_tts: true
include_keyword_papers: false

# LLM Call Configurations
influence_filter:
  provider: openai
  model: gpt-5-mini-2025-08-07

scoring:
  provider: openai
  model: gpt-5.4-mini-2026-03-17

podcast:
  provider: gemini
  model: gemini-3.1-pro-preview

manga_planner:
  provider: gemini
  model: gemini-3.1-pro-preview

manga_image:
  provider: openai
  model: gpt-image-2
  size: 1024x1536
  quality: high
  output_format: png
  char_cutoff: 30000

tts:
  provider: gemini
  model: gemini-2.5-flash-preview-tts
  voice: Zephyr

affiliation:
  provider: gemini
  model: gemini-3-flash-preview

# Other settings
compress_to_64kbps: true
pricing_path: my_config/pricing.json
ir_limit: 50
nlp_limit: 50
others_limit: 50
keywords_path: my_config/keywords.yaml
top_n: 3
top_n_tts: 3
abst_word_cutoff: 200
transcript_word_cutoff: 1000
arxiv_timeout: 30
openai_timeout: 360
influence_score_threshold: 3

scoring_aspects_path: my_config/scoring_aspects.yaml
scoring_max_workers: 150
