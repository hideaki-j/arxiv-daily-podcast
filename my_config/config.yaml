# Feature flags
email_enabled: true
require_priority_author_match: true
minimum_email_score: 7
generate_transcript: false
generate_manga_image: false
filter_since_last_schedule: true
use_tts: false
include_keyword_papers: false

# LLM Call Configurations
influence_filter:
  provider: openai
  model: gpt-6-luna

scoring:
  provider: openai
  model: gpt-6-luna

podcast:
  provider: openai
  model: gpt-6-luna

manga_planner:
  provider: openai
  model: gpt-6-luna

manga_image:
  provider: openai
  model: gpt-image-2
  size: 1024x1536
  quality: high
  output_format: png
  char_cutoff: 30000

affiliation:
  provider: openai
  model: gpt-6-luna

# Other settings
compress_to_64kbps: true
pricing_path: my_config/pricing.json
ir_limit: 50
nlp_limit: 50
others_limit: 50
keywords_path: my_config/keywords.yaml
top_n: 3
top_n_tts: 0
abst_word_cutoff: 200
transcript_word_cutoff: 1000
arxiv_timeout: 30
openai_timeout: 360
influence_score_threshold: 3

scoring_aspects_path: my_config/scoring_aspects.yaml
scoring_max_workers: 150
